
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yêu cầu đổi kho GHN</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px;
      background: #101827;
      color: #f4f7fc;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 6px;
    }

    .sub {
      color: #a8bad0;
      margin: 0 0 20px;
      line-height: 1.5;
    }

    .panel {
      background: #1d2b3e;
      border: 1px solid #334b64;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 19px;
      margin: 0 0 20px;
    }

    label.field {
      display: block;
      margin: 17px 0 8px;
      font-weight: 700;
    }

    input[type="text"],
    select,
    textarea {
      display: block;
      width: 100%;
      padding: 14px;
      border: 1px solid #3c5875;
      border-radius: 11px;
      background: #101d2f;
      color: white;
      font: inherit;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #5ea5ff;
    }

    .radio {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 10px 0;
      cursor: pointer;
    }

    .radio input {
      accent-color: #61a7ff;
      width: 18px;
      height: 18px;
    }

    .hint {
      color: #a8bad0;
      font-size: 13px;
      margin-top: 7px;
      line-height: 1.5;
    }

    .stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin: 13px 0;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 13px 17px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: #2864bd;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #3d526c;
    }

    button.submit {
      background: #168257;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #resultCard {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #172638;
      border: 1px solid #365573;
      border-radius: 12px;
      padding: 17px;
      margin-top: 15px;
      line-height: 1.65;
    }

    #resultCard.error {
      border-color: #d96565;
    }

    #resultCard.success {
      border-color: #39a978;
    }

    [hidden] {
      display: none !important;
    }

    .notice {
      font-size: 13px;
      color: #ffd18a;
      line-height: 1.5;
      margin-top: 12px;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>📦 YÊU CẦU ĐỔI KHO GHN</h1>
  <p class="sub">
    Biểu mẫu kiểm tra và gửi yêu cầu đổi kho.
  </p>

  <section class="panel">
    <h2>Thông tin nhân viên</h2>

    <label class="field" for="branch">
      Bưu cục *
    </label>

    <select id="branch">
      <option value="">-- Chọn bưu cục --</option>

      <option value="20047000">
        20047000 - Bưu Cục 53 Lãng Yên
      </option>

      <option value="20081000">
        20081000 - Bưu Cục 16A Hòa Mã
      </option>

      <option value="21488000">
        21488000 - Bưu Cục 298 Trần Điền
      </option>

      <option value="22925000">
        22925000 - Bưu Cục 79/9B Thanh Đàm
      </option>

      <option value="23063000">
        23063000 - (HNO) CK Hai Bà Trưng
      </option>

      <option value="23183000">
        23183000 - (HNO) Lĩnh Nam
      </option>
    </select>

    <label class="field" for="msnv">
      Mã nhân viên *
    </label>

    <input
      id="msnv"
      type="text"
      placeholder="Nhập MSNV"
      autocomplete="off"
    >
  </section>

  <section class="panel">
    <h2>Thông tin đổi kho</h2>

    <label class="field">
      Loại kho cần đổi *
    </label>

    <label class="radio">
      <input
        type="radio"
        name="warehouseType"
        value="Kho Giao"
      >
      Kho Giao
    </label>

    <label class="radio">
      <input
        type="radio"
        name="warehouseType"
        value="Kho Lấy"
      >
      Kho Lấy
    </label>

    <label class="radio">
      <input
        type="radio"
        name="warehouseType"
        value="Kho Trả"
      >
      Kho Trả
    </label>

    <div id="destinationGroup">
      <label class="field" for="destination">
        Mã kho đích *
      </label>

      <input
        id="destination"
        type="text"
        placeholder="Nhập mã kho cần chuyển đến"
        inputmode="numeric"
      >
    </div>
  </section>

  <section class="panel">
    <h2>Danh sách mã đơn</h2>

    <label class="field" for="codes">
      Mã đơn (mỗi dòng một mã) *
    </label>

    <textarea
      id="codes"
      placeholder="Nhập mã đơn thứ nhất&#10;Nhập mã đơn thứ hai"
    ></textarea>

    <div class="hint">
      Có thể nhập nhiều mã, ngăn cách bằng xuống dòng,
      dấu phẩy hoặc khoảng trắng.
    </div>

    <div class="stats">
      <span>
        Mã duy nhất:
        <strong id="total">0</strong>
      </span>

      <span>
        Mã trùng:
        <strong id="duplicates">0</strong>
      </span>
    </div>

    <div class="buttons">
      <button type="button" onclick="checkRequest()">
        🔎 Kiểm tra
      </button>

      <button
        type="button"
        class="submit"
        id="sendButton"
        onclick="sendRequest()"
      >
        📤 Gửi yêu cầu
      </button>

      <button
        type="button"
        class="secondary"
        onclick="clearCodes()"
      >
        Xóa mã đơn
      </button>
    </div>


    <div
      id="resultCard"
      hidden
      role="status"
      aria-live="polite"
    ></div>
  </section>

</div>

<script>
  const WEBHOOK_URL =
    "https://tiennv.app.n8n.cloud/webhook/ghn-doi-kho";

  const codesInput =
    document.getElementById("codes");

  const totalElement =
    document.getElementById("total");

  const duplicatesElement =
    document.getElementById("duplicates");

  const resultCard =
    document.getElementById("resultCard");

  const destinationInput =
    document.getElementById("destination");

  const sendButton =
    document.getElementById("sendButton");

  function parseCodes(raw) {
    const parts = raw
      .toUpperCase()
      .split(/[\s,;]+/)
      .map(x => x.trim())
      .filter(Boolean);

    const unique = [];
    const duplicates = [];
    const seen = new Set();

    for (const code of parts) {
      if (seen.has(code)) {
        duplicates.push(code);
      } else {
        seen.add(code);
        unique.push(code);
      }
    }

    return { unique, duplicates };
  }

  function updateStats() {
    const data = parseCodes(codesInput.value);

    totalElement.textContent =
      data.unique.length;

    duplicatesElement.textContent =
      data.duplicates.length;
  }

  codesInput.addEventListener(
    "input",
    updateStats
  );

  function clearCodes() {
    codesInput.value = "";
    updateStats();
    resultCard.hidden = true;
    codesInput.focus();
  }

  function showResult(text, error = false) {
    resultCard.hidden = false;

    resultCard.className =
      error ? "error" : "success";

    resultCard.textContent = text;

    resultCard.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }

  function getRequest() {
    const branch =
      document.getElementById("branch").value;

    const msnv =
      document.getElementById("msnv")
        .value.trim();

    const warehouseType =
      document.querySelector(
        'input[name="warehouseType"]:checked'
      )?.value;

    const destination =
      destinationInput.value.trim();

    const data =
      parseCodes(codesInput.value);

    if (
      !branch ||
      !msnv ||
      !warehouseType ||
      !destination ||
      data.unique.length === 0
    ) {
      throw new Error(
        "Vui lòng điền đầy đủ các trường bắt buộc."
      );
    }

    const invalid = data.unique.filter(
      code => !/^[A-Z0-9_-]+$/.test(code)
    );

    if (invalid.length) {
      throw new Error(
        "Mã chứa ký tự không hợp lệ:\n" +
        invalid.join("\n")
      );
    }

    return {
      branch,
      msnv,
      warehouseType,
      destination,
      codes: data.unique,
      duplicates: data.duplicates
    };
  }

  function formatRequest(data) {
    return [
      "ĐÃ KIỂM TRA THÔNG TIN",
      "",
      "Bưu cục: " + data.branch,
      "MSNV: " + data.msnv,
      "Loại kho: " + data.warehouseType,
      "Kho đích: " + data.destination,
      "Số mã duy nhất: " + data.codes.length,
      "Mã trùng: " + data.duplicates.length,
      "",
      "DANH SÁCH MÃ ĐƠN:",
      ...data.codes
    ].join("\n");
  }

  function checkRequest() {
    try {
      const data = getRequest();
      showResult(formatRequest(data));
    } catch (err) {
      showResult(err.message, true);
    }
  }

  async function sendRequest() {
    let data;

    try {
      data = getRequest();
    } catch (err) {
      showResult(err.message, true);
      return;
    }

    sendButton.disabled = true;
    sendButton.textContent = "Đang gửi...";

    try {
      const response = await fetch(
        WEBHOOK_URL,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            branch: data.branch,
            msnv: data.msnv,
            warehouseType: data.warehouseType,
            destination: data.destination,
            codes: data.codes
          })
        }
      );

      if (!response.ok) {
        throw new Error(
          "HTTP " + response.status
        );
      }

      showResult(
        "✅ Đã gửi yêu cầu đổi kho thành công.\n\n" +
        formatRequest(data)
      );

    } catch (err) {
      showResult(
        "Chưa xác nhận được việc gửi yêu cầu. " +
        "Kiểm tra Executions trong n8n " +
        "trước khi gửi lại để tránh trùng.\n" +
        "Chi tiết: " + err.message,
        true
      );

    } finally {
      sendButton.disabled = false;
      sendButton.textContent = "📤 Gửi yêu cầu";
    }
  }
</script>

</body>
</html>
